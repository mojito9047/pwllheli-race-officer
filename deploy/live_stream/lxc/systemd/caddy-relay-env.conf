# Installed by setup.sh to /etc/systemd/system/caddy.service.d/relay-env.conf
#
# Caddy is installed from the distro package, so its unit is not ours to edit.
# A drop-in adds the relay's environment without touching that unit, and
# survives a caddy upgrade.
#
# What it is for: the Caddyfile presents a Cloudflare Access service token
# (HUT_ACCESS_ID / HUT_ACCESS_SECRET) when it proxies to hut-origin. Without
# these two the headers go out empty and, once the Access policy on hut-origin
# is live, the relay is locked out of the hut app along with everybody else.
#
# Note that `systemctl reload caddy` re-reads the Caddyfile but NOT this file.
# After changing relay.env, Caddy needs a restart.
[Service]
EnvironmentFile=/etc/relay/relay.env
